<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">


</head>

<body>

    <h1>Simon says</h1>

    <h3>Follow Simon's pattern as best as you can</h3>

    <button id="GameStart" type="button">Start!</button>

    <h3>Simon's Instruction</h3>

    <div id="playerScore">

        <h4>SCORE: </h4>
    </div>

    <div id="simonInstruction">
        <p>Simon Says:</p>
    </div>

    <div id="playerInput">
        <p>Your input:</p>
    </div>

    <div id="simonFeedback">
        <p>Simon Says:</p>
    </div>

    <button id="ButtonUp" type="button">Up</button>
    <button id="ButtonDown" type="button">Down</button>
    <button id="ButtonRight" type="button">Right</button>
    <button id="ButtonLeft" type="button">Left</button>

    <button id="GameReset" type="button">Reset</button>



    <script src="app.js"></script>

</body>

</html>
